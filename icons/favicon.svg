<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cookbox icon: Simple cooking pot with steam -->
  <defs>
    <style>
      .pot { fill: #e2b714; }
      .steam { fill: none; stroke: #4ade80; stroke-width: 3; stroke-linecap: round; }
      .lid { fill: #c9a012; }
    </style>
  </defs>

  <!-- Pot body -->
  <rect class="pot" x="25" y="45" width="50" height="35" rx="4" />

  <!-- Pot handles -->
  <path class="pot" d="M 20 55 Q 15 55 15 50 Q 15 45 20 45" />
  <path class="pot" d="M 80 55 Q 85 55 85 50 Q 85 45 80 45" />

  <!-- Lid -->
  <ellipse class="lid" cx="50" cy="45" rx="28" ry="8" />
  <circle class="lid" cx="50" cy="40" r="5" />

  <!-- Steam wisps -->
  <path class="steam" d="M 35 35 Q 33 25 35 15" />
  <path class="steam" d="M 50 35 Q 50 22 50 10" />
  <path class="steam" d="M 65 35 Q 67 25 65 15" />
</svg>
